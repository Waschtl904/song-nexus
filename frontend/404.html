<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>404 – Seite nicht gefunden · SONG-NEXUS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/main.css">

  <style>
    .error-wrap {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1rem;
      gap: 1rem;
    }
    .error-code {
      font-family: 'Orbitron', monospace;
      font-size: clamp(3.5rem, 12vw, 7rem);
      font-weight: 900;
      line-height: 1;
      margin: 0;
      color: var(--color-primary, #00cc44);
    }
    .error-title {
      font-size: clamp(1.1rem, 4vw, 1.6rem);
      margin: 0;
    }
    .error-text {
      max-width: 46ch;
      margin: 0;
      color: var(--color-text-muted, #9aa39a);
      line-height: 1.6;
    }
    .error-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <main class="error-wrap">
    <p class="error-code">404</p>
    <h1 class="error-title">Diese Seite existiert nicht</h1>
    <p class="error-text">
      Der Link ist entweder veraltet oder enthält einen Tippfehler.
      Von hier kommst du weiter:
    </p>

    <nav class="error-links" aria-label="Weiterführende Links">
      <a href="/" class="button">Zur Startseite</a>
      <a href="/transparency.html" class="button button-secondary">Transparenz</a>
      <a href="/blog/" class="button button-secondary">Blog</a>
    </nav>
  </main>

  <footer role="contentinfo" style="text-align:center; padding:1.5rem 1rem; font-size:0.8rem;">
    <a href="/impressum.html">Impressum</a>
    &nbsp;·&nbsp;
    <a href="/datenschutz.html">Datenschutz</a>
    &nbsp;·&nbsp;
    <span>Kein Tracking</span>
  </footer>
</body>
</html>
